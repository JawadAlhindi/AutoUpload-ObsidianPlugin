title: Auto Uploader for Obsidian
description: Auto-upload images and videos to cloud providers (YouTube, Cloudflare R2, S3) from Obsidian
theme: just-the-docs
url: https://jawadalhindi.github.io
baseurl: /AutoUploader-Obsidian-plugin

# Color scheme
color_scheme: light

# Search
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

# Navigation
nav_enabled: true
nav_sort: case_insensitive

# Footer
gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/JawadAlhindi/AutoUploader-Obsidian-plugin"
gh_edit_branch: "main"
gh_edit_source: docs
gh_edit_view_mode: "tree"

# Callouts
callouts:
  warning:
    title: Warning
    color: yellow
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: green

# Back to top
back_to_top: true
back_to_top_text: "Back to top"

# Footer content
footer_content: "Copyright &copy; 2024 Jawad Alhindi. Distributed under MIT License."

# Last modified date
last_edit_timestamp: true
last_edit_time_format: "%b %e %Y at %I:%M %p"

# Plugins
plugins:
  - jekyll-seo-tag
